name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            platform: Win32
          - arch: x64
            platform: x64

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A ${{ matrix.platform }}

      - name: Build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: TextureToolkit-${{ matrix.arch }}
          path: build/Release/TextureToolkit-${{ matrix.arch }}.asi
          if-no-files-found: error

  release:
    # A tag build publishes what the matrix above produced, so the release carries the same
    # binaries CI verified rather than something built by hand.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TextureToolkit-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: TextureToolkit-*.asi
          generate_release_notes: true
